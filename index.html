<!DOCTYPE html>
<html>
<head>
  <title>Tourizia Admin</title>

  <style>
    body {
      font-family: Arial;
      background: #0A1F44;
      color: white;
      padding: 30px;
    }

    h1 {
      margin-bottom: 30px;
    }

    .card {
      background: white;
      color: black;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    button {
      background: #1e3a8a;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #0A1F44;
    }
  </style>
</head>

<body>

<h1>✈️ Tourizia Premium Dashboard</h1>
<select id="filter" onchange="loadRequests()">
  <option value="pending">🟡 Pending</option>
  <option value="done">✅ Done</option>
</select>

<div id="list"></div>

<script>

const API = "https://api.tourizia.com";

async function loadRequests() {

  const filter = document.getElementById("filter").value;

const endpoint = filter === "done"
  ? "/admin/history"
  : "/admin/premium-requests";

const res = await fetch(`${API}${endpoint}`);
const data = await res.json();

  const list = document.getElementById("list");
  list.innerHTML = "";

  data.forEach((s, i) => {

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div>
  📧 ${s.customer_email}<br>
  ✈ ${s.metadata.from} → ${s.metadata.to}<br>
  <span>🟡 ${s.status || "pending"}</span>
  <span>🎯 Visa Score: ${s.metadata?.visaScore || "-"}/100</span>
</div>
<input placeholder="Airline" id="airline-${i}">
<input placeholder="Departure" id="dep-${i}">
<input placeholder="Arrival" id="arr-${i}">

<div style="display:flex; gap:10px">
  <button onclick="generate(${i})">
    Générer
  </button>

  <button onclick="autoGenerate(${i})">
    ⚡ Auto
  </button>
  <button onclick="preview(${i})">👀 Preview</button>

  <button onclick="generateCustom(${i})">✏️ Custom</button>

</div>
    `;

    list.appendChild(div);
  });
}

async function generate(index) {

  await fetch(`${API}/admin/generate-premium`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ sessionIndex: index })
  });

  alert("✅ PDF envoyé");

  loadRequests();
}
async function autoGenerate(index) {

  await fetch(`${API}/admin/generate-premium`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ sessionIndex: index })
  });

  alert("⚡ PDF auto envoyé");
  loadRequests();
}
async function preview(index) {

  const res = await fetch(`${API}/admin/preview-ticket`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sessionIndex: index })
  });

  const html = await res.text();

  const win = window.open();
  win.document.write(html);
}
async function generateCustom(index) {

  const airline = document.getElementById(`airline-${index}`).value;
  const dep = document.getElementById(`dep-${index}`).value;
  const arr = document.getElementById(`arr-${index}`).value;

  await fetch(`${API}/admin/generate-premium`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      sessionIndex: index,
      airline,
      departureTime: dep,
      arrivalTime: arr
    })
  });

  alert("✏️ PDF personnalisé envoyé");
}

loadRequests();

</script>

</body>
</html>
